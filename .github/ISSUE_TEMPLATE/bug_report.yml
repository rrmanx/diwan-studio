name: Bug report
description: Something broke, looks wrong, or does not match the docs.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, `.env` contents, or private tokens.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and whether you used the live site or a local build.
      placeholder: Safari 18 / macOS 15 / live site
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options:
        - live (proxy)
        - demo (preview corpus)
        - not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots or extra context
      description: Drag images in here. Redact anything private.
    validations:
      required: false
